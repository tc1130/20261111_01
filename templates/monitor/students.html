{% extends "base.html" %}
{% block title %}学生管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">学生管理</h4>
    <form method="get" class="d-flex">
        <input type="text" name="q" class="form-control me-2" placeholder="按学号或姓名搜索" value="{{ keyword }}">
        <button class="btn btn-outline-primary">搜索</button>
    </form>
</div>

<div class="card">
    <div class="card-body">
        {% if students %}
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>学号</th>
                    <th>姓名</th>
                    <th class="text-end">操作</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td>{{ s.student_id }}</td>
                    <td>{{ s.name }}</td>
                    <td class="text-end">
                        <a href="{{ url_for('monitor_student_detail', user_id=s.id) }}" class="btn btn-sm btn-outline-primary">详情</a>
                        <form method="post" action="{{ url_for('monitor_delete_student', user_id=s.id) }}"
                              class="d-inline" onsubmit="return confirm('确定删除该学生及其所有提交文件吗？');">
                            <button class="btn btn-sm btn-outline-danger">删除</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="alert alert-info mb-0">暂无学生</div>
        {% endif %}
    </div>
</div>
{% endblock %}
