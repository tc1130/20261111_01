{% extends "base.html" %}
{% block title %}我的提交记录{% endblock %}
{% block content %}
<h4 class="mb-3">我的提交记录</h4>
<div class="card">
    <div class="card-body">
        {% if subs %}
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>任务</th>
                    <th>文件</th>
                    <th>提交时间</th>
                </tr>
            </thead>
            <tbody>
                {% for s in subs %}
                <tr>
                    <td>{{ s.task.title }}</td>
                    <td>{{ s.original_name }}</td>
                    <td>{{ s.submitted_at.strftime('%Y-%m-%d %H:%M:%S') }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <div class="alert alert-info mb-0">暂无提交记录</div>
        {% endif %}
    </div>
</div>
{% endblock %}
