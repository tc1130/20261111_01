<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 学委解放神器</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        html, body { margin: 0; height: 100%; }
        body {
            background: url("{{ url_for('static', filename='img/login_bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }

        /* 半透明毛玻璃卡片（登录框 + 注册弹窗共用） */
        .glass {
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.18);
        }
        .login-card { width: 100%; max-width: 380px; padding: 34px 30px; }

        .flash-wrap {
            position: fixed; top: 24px; left: 50%; transform: translateX(-50%);
            z-index: 3000; width: 90%; max-width: 460px;
        }
    </style>
</head>
<body>

<!-- flash 提示 -->
<div class="flash-wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endwith %}
</div>

<!-- 登录框 -->
<div class="glass login-card">
    <h4 class="text-center mb-1"><i class="bi bi-journal-check"></i></h4>
    <h5 class="text-center mb-4">学委解放神器</h5>
    <form method="post">
        <div class="mb-3">
            <label class="form-label">学号</label>
            <input type="text" name="student_id" class="form-control" placeholder="请输入学号" required>
        </div>
        <div class="mb-3">
            <label class="form-label">密码</label>
            <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">登录</button>
    </form>
    <div class="text-center mt-3">
        <span class="text-muted">还没有账号？</span>
        <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal">注册</a>
    </div>
</div>

<!-- 注册弹窗 -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass">
            <div class="modal-header border-0">
                <h5 class="modal-title"><i class="bi bi-person-plus"></i> 学生注册</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form method="post" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label class="form-label">学号</label>
                        <input type="text" name="student_id" class="form-control" placeholder="请输入学号" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">姓名</label>
                        <input type="text" name="name" class="form-control" placeholder="请输入姓名" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">密码</label>
                        <input type="password" name="password" class="form-control" placeholder="请设置密码" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认密码</label>
                        <input type="password" name="confirm" class="form-control" placeholder="请再次输入密码" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">注册</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // 注册失败跳回登录页时，自动打开注册弹窗
    {% if request.args.get('show_register') %}
    var regModal = new bootstrap.Modal(document.getElementById('registerModal'));
    regModal.show();
    {% endif %}
</script>
</body>
</html>
